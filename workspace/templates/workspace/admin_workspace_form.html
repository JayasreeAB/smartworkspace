{% extends 'workspace/base.html' %}

{% block content %}

<style>

    .form-box {
        max-width: 700px;
        margin: 40px auto;
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .form-box p {
        margin-bottom: 18px;
    }

    .form-box input,
    .form-box textarea,
    .form-box select {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
    }

    .form-box button {
        padding: 11px 20px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

</style>


<div class="form-box">

    <h1>{{ title }}</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save
        </button>

    </form>

</div>

{% endblock %}
