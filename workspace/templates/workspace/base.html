{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Smart Workspace</title>

    <link rel="stylesheet"
          href="{% static 'workspace/style.css' %}">

</head>

<body>

<nav>

    <div class="logo">
        Smart Workspace
    </div>

    {% if user.is_authenticated %}

    <div class="nav-links">

        <a href="{% url 'home' %}">Home</a>

        <a href="{% url 'resources' %}">
            Resources
        </a>

        <a href="{% url 'workspaces' %}">
            Workspaces
        </a>

        <a href="{% url 'profile' %}">
            Profile
        </a>

        <a href="{% url 'maintenance' %}">
            Maintenance
        </a>

        <a href="{% url 'complaint' %}">
            Complaints
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </div>

    {% endif %}

</nav>

{% if messages %}

    {% for message in messages %}

        <div class="message">
            {{ message }}
        </div>

    {% endfor %}

{% endif %}


{% block content %}

{% endblock %}

<script src="{% static 'workspace/script.js' %}"></script>

</body>

</html>
