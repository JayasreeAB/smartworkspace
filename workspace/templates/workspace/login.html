{% extends 'workspace/base.html' %}

{% block content %}

<style>

    .login-container {
        max-width: 450px;
        margin: 50px auto;
        padding: 35px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    .login-container h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    .login-type {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
    }

    .login-type label {
        flex: 1;
        padding: 12px;
        text-align: center;
        border: 1px solid #ddd;
        border-radius: 8px;
        cursor: pointer;
    }

    .login-type input {
        margin-right: 8px;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 7px;
        box-sizing: border-box;
    }

    .login-container button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-size: 16px;
    }

    .login-container p {
        text-align: center;
        margin-top: 20px;
    }

    .error-message {
        background: #ffe5e5;
        color: #b00020;
        padding: 10px;
        border-radius: 7px;
        margin-bottom: 15px;
        text-align: center;
    }

</style>


<div class="login-container">

    <h1>Welcome Back</h1>

    {% if messages %}

        {% for message in messages %}

            <div class="error-message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}

        <div class="login-type">

            <label>
                <input
                    type="radio"
                    name="login_type"
                    value="user"
                    checked
                >
                User
            </label>

            <label>
                <input
                    type="radio"
                    name="login_type"
                    value="admin"
                >
                Admin
            </label>

        </div>


        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p>
        Don't have an account?

        <a href="{% url 'register' %}">
            Register
        </a>
    </p>

</div>

{% endblock %}
